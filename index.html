<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>やりたいことスタンプ帳</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="root"><p class="center">読み込み中…</p></div>
<dialog id="dlg"></dialog>

<script type="module">
const root = document.getElementById("root"), dlg = document.getElementById("dlg");
let C;
try { C = await import("./common.js"); }
catch (e) {
  console.error(e);
  root.innerHTML = `<div class="center"><h1>設定を確認してください</h1><p>config.js・common.js・style.css が index.html と同じ場所にあるか、<br>config.js に設定値が入っているかを確認してください。</p></div>`;
  throw e;
}
const { fs, esc, fmt, fmtJ, today, nowTime, hash, uid, toast, fail, stampSVG } = C;

const PENS = ["#3A3428","#B8323B","#2B64A8","#2F7D52","#C46A1C"];
const SIZES = [["小",4.2],["中",5.6],["大",7.6]];
const WIDTHS = [["細",0.005],["太",0.012]];
const MAX_PHOTOS = 8, MAX_POINTS = 60000;
const SAMPLES = ["着物でおでかけ","手芸会","テーブルマナー教室に行く"];

let user = null, title = C.DEFAULT_TITLE, items = [], loaded = false, unsubs = [];
let view = "list", pageId = null, pageData = { texts: [], strokes: [] }, photos = [], pageUnsubs = [], shellKey = "";
let cur = null, tapPos = null, justStamped = null, penMode = false, pen = { c: PENS[0], w: WIDTHS[0][1] };
let drag = null, deferred = false, suppressClick = false, stroke = null, textSize = 5.6, textColor = PENS[0], saveTimer = null, pending = {};

const find = id => items.find(i => i.id === id);
const val = id => (document.getElementById(id)?.value || "").trim();
const safeColor = c => PENS.includes(c) ? c : PENS[0];
const rnd = v => Math.round(v * 1000) / 1000;
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const todoItems = () => items.filter(i => !i.done).sort((a, b) => (a.planDate || "9999").localeCompare(b.planDate || "9999"));
const doneItems = () => items.filter(i => i.done).sort((a, b) => ((a.date || "") + (a.time || "")).localeCompare((b.date || "") + (b.time || "")));
const newItem = (t, plan = "", note = "") => ({ title: t, planDate: plan, note, done: false, date: "", time: "", stampedBy: "", createdAt: fs.serverTimestamp() });
function posOf(i){
  if (typeof i.x === "number" && typeof i.y === "number") return { x: i.x, y: i.y, r: i.rot || 0 };
  const h = hash(i.id); return { x: 0.68, y: 0.2, r: (h % 13) - 6 };
}

// ---------- 画面の切り替え ----------
function route(){
  const h = location.hash;
  const nv = h.startsWith("#p-") ? "page" : h === "#book" ? "book" : "list";
  const np = nv === "page" ? decodeURIComponent(h.slice(3)) : null;
  if (np !== pageId) {
    pageUnsubs.forEach(f => f()); pageUnsubs = [];
    pageData = { texts: [], strokes: [] }; photos = []; penMode = false; pageId = np;
    if (np && user) subscribePage(np);
  }
  if (nv !== view) window.scrollTo(0, 0);
  view = nv; if (dlg.open) dlg.close(); render();
}
window.addEventListener("hashchange", route);

function top(){
  const tab = (h, label, on) => `<a class="tab" href="${h}" ${on ? 'aria-current="page"' : ""}>${label}</a>`;
  return `<div class="userbar">${C.isAdmin(user) ? `<a class="ghost" href="admin.html">管理</a>` : ""}<span>${esc(user.displayName || user.email)}</span><button class="ghost" data-act="logout">ログアウト</button></div>
    <div class="booktitle"><h1>${esc(title)}</h1><button class="ghost" data-act="rename" aria-label="タイトルを変更">✎</button></div>
    <nav class="tabs">${tab("#list", "やりたいことリスト", view === "list")}${tab("#book", `スタンプ帳（${items.filter(i => i.done).length}）`, view !== "list")}</nav>`;
}
function render(){
  if (!user) { shellKey = ""; root.innerHTML = `<div class="center"><h1>やりたいことスタンプ帳</h1><p>メンバーのGoogleアカウントでログインしてください。</p><button class="btn primary" data-act="login">Googleでログイン</button></div>`; return; }
  if (!loaded) { shellKey = ""; root.innerHTML = `<p class="center">読み込み中…</p>`; return; }
  if (view === "page") {
    if (!find(pageId)) { shellKey = ""; root.innerHTML = top() + `<div class="paper emptybook">このページは見つかりませんでした。</div>`; return; }
    if (shellKey !== "page:" + pageId) buildPageShell();
    updatePage(); return;
  }
  shellKey = view;
  root.innerHTML = top() + (view === "book" ? bookView() : listView());
}

// ---------- リスト ----------
function rowHTML(i){
  let meta, cls = "";
  if (i.done) meta = `${fmt(i.date)} にスタンプ`;
  else if (i.planDate) { meta = `予定 ${fmtJ(i.planDate)}`; if (i.planDate < today()) { meta += "・過ぎています"; cls = "soon"; } else if (i.planDate === today()) { meta += "・今日！"; cls = "soon"; } }
  else meta = "予定日はまだ";
  return `<li class="${i.done ? "done" : ""}"><button class="rowbtn" data-act="item" data-id="${esc(i.id)}"><span class="box">${i.done ? "✓" : ""}</span>
    <span class="rowtext"><span class="rowtitle">${esc(i.title)}</span><span class="rowmeta ${cls}">${esc(meta)}</span></span></button></li>`;
}
function listView(){
  const td = todoItems(), dn = doneItems().reverse();
  return `<section class="paper listpaper">
    <div class="sechead"><h2>これからやりたいこと（${td.length}）</h2><button class="smallbtn" data-act="add">＋ 追加</button></div>
    <ul class="rows">${td.map(rowHTML).join("") || `<li class="note">「＋ 追加」から、やりたいことを書いてみましょう。</li>`}</ul>
    ${dn.length ? `<div class="sechead"><h2>やったこと（${dn.length}）</h2></div><ul class="rows">${dn.map(rowHTML).join("")}</ul>` : ""}
    ${items.length === 0 ? `<div class="row"><button class="btn" data-act="seed">「着物でおでかけ」など3つを入れる</button></div>` : ""}
    <p class="note">やり終えたら項目を開いて「やった！」を押すと、スタンプ帳のページに移動します。</p></section>`;
}

// ---------- スタンプ帳の目次 ----------
function bookView(){
  const dn = doneItems();
  if (!dn.length) return `<div class="paper emptybook">まだスタンプがありません。<br>リストの項目を「やった！」にすると、ここにページが増えていきます。</div>`;
  return `<div class="toc">${dn.map(i => `<a class="toccard paper" href="#p-${encodeURIComponent(i.id)}"><span class="mini">${stampSVG(i, i.date)}</span><b>${esc(i.title)}</b><span>${esc(fmt(i.date))}</span></a>`).join("")}</div>`;
}

// ---------- スクラップブックのページ ----------
function subscribePage(id){
  pageUnsubs.push(fs.onSnapshot(C.pageDoc(id), s => {
    const d = s.exists() ? s.data() : {};
    pageData = { texts: Array.isArray(d.texts) ? d.texts : [], strokes: Array.isArray(d.strokes) ? d.strokes : [] };
    updatePage();
  }, e => console.error(e)));
  pageUnsubs.push(fs.onSnapshot(fs.query(C.photosRef(id), fs.orderBy("createdAt")), s => {
    photos = s.docs.map(d => ({ id: d.id, ...d.data() })); updatePage();
  }, e => console.error(e)));
}
let area, canvas, ctx, ro;
function buildPageShell(){
  root.innerHTML = `<div id="top"></div><div class="pagenav" id="pagenav"></div>
    <section class="paper page" id="page"><div class="pagehead" id="pagehead"></div>
      <div class="area" id="area"><div class="layer" id="Lphotos"></div><div class="layer" id="Ltexts"></div><div class="layer" id="Lstamp"></div>
        <canvas id="inkcanvas"></canvas><div class="hint" id="hint"></div></div></section>
    <div class="tools" id="tools"></div><input type="file" id="photoin" accept="image/*" hidden>`;
  shellKey = "page:" + pageId;
  area = document.getElementById("area"); canvas = document.getElementById("inkcanvas"); ctx = canvas.getContext("2d");
  if (ro) ro.disconnect();
  ro = new ResizeObserver(sizeCanvas); ro.observe(area);
  area.addEventListener("pointerdown", onDown);
  area.addEventListener("pointermove", onMove);
  area.addEventListener("pointerup", onUp);
  area.addEventListener("pointercancel", onUp);
  area.addEventListener("click", onAreaClick);
  canvas.addEventListener("pointerdown", penDown);
  canvas.addEventListener("pointermove", penMove);
  canvas.addEventListener("pointerup", penUp);
  canvas.addEventListener("pointercancel", penUp);
  document.getElementById("photoin").addEventListener("change", onPhoto);
}
function updatePage(){
  if (view !== "page" || shellKey !== "page:" + pageId) return;
  if (drag || stroke) { deferred = true; return; }
  const it = find(pageId); if (!it) { render(); return; }
  document.getElementById("top").innerHTML = top();
  const dn = doneItems(), idx = dn.findIndex(x => x.id === it.id);
  const prev = idx > 0 ? dn[idx - 1] : null, next = idx >= 0 && idx < dn.length - 1 ? dn[idx + 1] : null;
  document.getElementById("pagenav").innerHTML = `<button class="ghost" data-act="go" data-id="${esc(prev?.id || "")}" ${prev ? "" : "disabled"} aria-label="前のページ">‹</button>
    <span class="where">${idx >= 0 ? `${idx + 1} / ${dn.length} ページ` : "まだスタンプを押していないページ"}</span>
    <button class="ghost" data-act="go" data-id="${esc(next?.id || "")}" ${next ? "" : "disabled"} aria-label="次のページ">›</button>`;
  document.getElementById("pagehead").innerHTML = `<h2>${esc(it.title)}</h2><p>${it.done ? `${esc(fmt(it.date))}${it.time ? " " + esc(it.time) : ""} 達成` : it.planDate ? `予定 ${esc(fmtJ(it.planDate))}` : "&nbsp;"}</p>`;
  area.classList.toggle("unstamped", !it.done);
  area.classList.toggle("pen", penMode);
  document.getElementById("Lphotos").innerHTML = photos.filter(p => String(p.data || "").startsWith("data:image/")).map(p =>
    `<div class="el photo" data-kind="photo" data-id="${esc(p.id)}" style="left:${p.x * 100}%;top:${p.y * 100}%;width:${(p.w || .46) * 100}%;--r:${p.rot || 0}deg"><img src="${esc(p.data)}" alt="貼った写真"></div>`).join("");
  document.getElementById("Ltexts").innerHTML = pageData.texts.map(t =>
    `<div class="el text" data-kind="text" data-id="${esc(t.id)}" style="left:${t.x * 100}%;top:${t.y * 100}%;--r:${t.rot || 0}deg;color:${safeColor(t.c)};font-size:${clamp(+t.s || 5.6, 3, 9)}cqw">${esc(t.t)}</div>`).join("");
  let stampHTML = "";
  if (it.done) { const p = posOf(it); stampHTML = `<div class="el stamp${justStamped === it.id ? " drop" : ""}" data-kind="stamp" data-id="${esc(it.id)}" style="left:${p.x * 100}%;top:${p.y * 100}%;--r:${p.r}deg">${stampSVG(it, it.date)}</div>`; }
  document.getElementById("Lstamp").innerHTML = stampHTML;
  if (justStamped === it.id) { const pgEl = document.getElementById("page"); pgEl.classList.add("thump"); setTimeout(() => pgEl.classList.remove("thump"), 800); }
  justStamped = null;
  const empty = !photos.length && !pageData.texts.length && !pageData.strokes.length;
  document.getElementById("hint").innerHTML = !it.done ? "好きなところをタップして<br>スタンプを押そう" : empty ? "テキスト・ペン・写真で<br>ページを飾ってみよう" : "";
  document.getElementById("tools").innerHTML = penMode
    ? PENS.map(c => `<button class="dot" style="--c:${c}" data-act="penc" data-c="${c}" aria-pressed="${pen.c === c}" aria-label="ペンの色"></button>`).join("")
      + WIDTHS.map(([n, w]) => `<button class="tool" data-act="penw" data-w="${w}" aria-pressed="${pen.w === w}">${n}</button>`).join("")
      + `<button class="tool" data-act="undo">元に戻す</button><span class="spacer"></span><button class="tool" data-act="pen" aria-pressed="true">完了</button><p class="toolnote">ページの上を指でなぞって描けます。</p>`
    : `<button class="tool" data-act="text">テキスト</button><button class="tool" data-act="pen">ペン</button><button class="tool" data-act="photo">写真（${photos.length}/${MAX_PHOTOS}）</button>
      <p class="toolnote">貼ったものはドラッグで動かせます。タップすると編集できます。</p>`;
  redraw();
}

// ドラッグで動かす・タップで編集
function onDown(e){
  if (penMode) return;
  const el = e.target.closest(".el"); if (!el) return;
  const r = area.getBoundingClientRect();
  drag = { el, kind: el.dataset.kind, id: el.dataset.id, sx: e.clientX, sy: e.clientY, ox: parseFloat(el.style.left), oy: parseFloat(el.style.top), r, moved: false };
  el.setPointerCapture(e.pointerId);
}
function onMove(e){
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;
  drag.moved = true; drag.el.classList.add("dragging");
  drag.el.style.left = clamp(drag.ox + dx / drag.r.width * 100, 4, 96) + "%";
  drag.el.style.top = clamp(drag.oy + dy / drag.r.height * 100, 4, 96) + "%";
}
function onUp(){
  if (!drag) return;
  const d = drag; drag = null; d.el.classList.remove("dragging");
  if (d.moved) {
    suppressClick = true; setTimeout(() => suppressClick = false, 50);
    const x = rnd(parseFloat(d.el.style.left) / 100), y = rnd(parseFloat(d.el.style.top) / 100);
    if (d.kind === "photo") { const p = photos.find(q => q.id === d.id); if (p) { p.x = x; p.y = y; } fs.updateDoc(C.photoDoc(pageId, d.id), { x, y }).catch(fail); }
    else if (d.kind === "text") { const t = pageData.texts.find(q => q.id === d.id); if (t) { t.x = x; t.y = y; savePage({ texts: pageData.texts }); } }
    else if (d.kind === "stamp") { const it = find(d.id); if (it) { it.x = x; it.y = y; } fs.updateDoc(C.itemDoc(d.id), { x, y }).catch(fail); }
  }
  if (deferred) { deferred = false; updatePage(); }
}
function onAreaClick(e){
  if (penMode || suppressClick) return;
  const el = e.target.closest(".el"), it = find(pageId);
  if (el) { const k = el.dataset.kind, id = el.dataset.id; if (k === "photo") openPhoto(id); else if (k === "text") openText(id); else if (k === "stamp") openStamp(); return; }
  if (it && !it.done) {
    const r = area.getBoundingClientRect();
    tapPos = { x: rnd(clamp((e.clientX - r.left) / r.width, 0.17, 0.83)), y: rnd(clamp((e.clientY - r.top) / r.height, 0.14, 0.86)) };
    openPress();
  }
}

// ペン
function sizeCanvas(){
  if (!canvas) return;
  const r = area.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(r.width * dpr); canvas.height = Math.round(r.height * dpr);
  redraw();
}
function drawStroke(s, from = 0){
  const W = canvas.width, H = canvas.height, p = s.p; if (!p || p.length < 2) return;
  ctx.strokeStyle = safeColor(s.c); ctx.lineWidth = Math.max(1, (s.w || .005) * W); ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); ctx.moveTo(p[from] * W, p[from + 1] * H);
  for (let k = from + 2; k < p.length; k += 2) ctx.lineTo(p[k] * W, p[k + 1] * H);
  if (p.length === 2) ctx.lineTo(p[0] * W + .5, p[1] * H);
  ctx.stroke();
}
function redraw(){ if (!ctx) return; ctx.clearRect(0, 0, canvas.width, canvas.height); pageData.strokes.forEach(s => drawStroke(s)); if (stroke) drawStroke(stroke); }
const pointCount = () => pageData.strokes.reduce((n, s) => n + (s.p?.length || 0), 0);
function penDown(e){
  if (!penMode) return;
  if (pointCount() > MAX_POINTS) { toast("このページはペンの書き込みがいっぱいです。"); return; }
  canvas.setPointerCapture(e.pointerId);
  const r = canvas.getBoundingClientRect();
  stroke = { c: pen.c, w: pen.w, p: [rnd((e.clientX - r.left) / r.width), rnd((e.clientY - r.top) / r.height)] };
  drawStroke(stroke);
}
function penMove(e){
  if (!stroke) return;
  const r = canvas.getBoundingClientRect(), x = rnd((e.clientX - r.left) / r.width), y = rnd((e.clientY - r.top) / r.height), n = stroke.p.length;
  if (Math.hypot(x - stroke.p[n - 2], (y - stroke.p[n - 1]) * 1.25) < 0.004) return;
  stroke.p.push(x, y); drawStroke(stroke, n - 2);
}
function penUp(){
  if (!stroke) return;
  pageData.strokes.push(stroke); stroke = null;
  savePageSoon({ strokes: pageData.strokes });
  if (deferred) { deferred = false; updatePage(); }
}
function savePage(data){ fs.setDoc(C.pageDoc(pageId), data, { merge: true }).catch(fail); }
function savePageSoon(data){ Object.assign(pending, data); clearTimeout(saveTimer); saveTimer = setTimeout(() => { const d = pending; pending = {}; savePage(d); }, 400); }

// 写真
async function shrink(file){
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = rej; im.src = u; });
  let max = 720, q = .72, out = "";
  for (let k = 0; k < 5; k++) {
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    out = cv.toDataURL("image/jpeg", q);
    if (out.length < 700000) return out;
    max *= .8; q -= .08;
  }
  return out;
}
async function onPhoto(e){
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  if (photos.length >= MAX_PHOTOS) { toast(`写真は1ページに${MAX_PHOTOS}枚までです。`); return; }
  toast("写真を貼っています…");
  try {
    const data = await shrink(file);
    if (data.length > 950000) { toast("写真が大きすぎて貼れませんでした。"); return; }
    await fs.addDoc(C.photosRef(pageId), { data, x: rnd(.3 + Math.random() * .4), y: rnd(.35 + Math.random() * .3), w: .46, rot: Math.round(Math.random() * 14 - 7), by: user.displayName || "", createdAt: fs.serverTimestamp() });
    toast("写真を貼りました。");
  } catch (err) { console.error(err); toast("写真を読み込めませんでした。別の写真で試してください。"); }
}

// ---------- ダイアログ ----------
function openSheet(html){ dlg.innerHTML = `<div class="sheet">${html}</div>`; if (!dlg.open) dlg.showModal(); }
const dateFields = (d, t) => `<div class="cols"><div><label for="f-date">やった日</label><input type="date" id="f-date" value="${esc(d)}"></div>
  <div><label for="f-time">時刻（なくてもOK）</label><input type="time" id="f-time" value="${esc(t)}"></div></div>`;
function openItem(id){
  const i = id ? find(id) : null; cur = id || null;
  openSheet(`<h2>${i ? "やりたいこと" : "やりたいことを追加"}</h2>
    <label for="f-title">やりたいこと</label><input type="text" id="f-title" maxlength="30" placeholder="例：お花見ピクニック" value="${esc(i?.title || "")}">
    <label for="f-plan">予定日</label><input type="date" id="f-plan" value="${esc(i?.planDate || "")}">
    <label for="f-note">メモ（場所・持ち物など）</label><textarea id="f-note">${esc(i?.note || "")}</textarea>
    ${i?.done ? `<p class="sub" style="margin-top:10px">${esc(fmt(i.date))} にスタンプを押しました</p>` : ""}
    <div class="row">${i ? `<button class="btn danger" data-act="del">削除</button>` : ""}<span class="spacer"></span>
      ${i ? (i.done ? `<button class="btn" data-act="gopage">ページを見る</button>` : `<button class="btn" data-act="did">やった！</button>`) : ""}
      <button class="btn primary" data-act="saveItem">${i ? "保存" : "追加"}</button></div>`);
  if (!i) setTimeout(() => document.getElementById("f-title")?.focus(), 30);
}
function openPress(){
  const it = find(pageId);
  openSheet(`<h2>スタンプを押す</h2><p class="sub">「${esc(it.title)}」のスタンプをここに押します。どんな柄かは押してのお楽しみ！</p>
    ${dateFields(today(), nowTime())}
    <div class="row"><span class="spacer"></span><button class="btn" data-act="close">やめる</button><button class="btn primary" data-act="press">ここに押す</button></div>`);
}
function openStamp(){
  const it = find(pageId); cur = it.id;
  openSheet(`<h2>${esc(it.title)}</h2>${it.stampedBy ? `<p class="sub">押した人：${esc(it.stampedBy)}</p>` : ""}
    ${dateFields(it.date, it.time || "")}
    <div class="row"><button class="btn danger" data-act="peel">スタンプをはがす</button><span class="spacer"></span><button class="btn" data-act="close">閉じる</button><button class="btn primary" data-act="saveStamp">保存</button></div>`);
}
function openText(id){
  const t = id ? pageData.texts.find(x => x.id === id) : null; cur = id || null;
  textSize = t ? +t.s || 5.6 : 5.6; textColor = t ? safeColor(t.c) : PENS[0];
  openSheet(`<h2>${t ? "テキストを編集" : "テキストを書く"}</h2>
    <textarea id="f-text" maxlength="200" placeholder="思い出を書こう">${esc(t?.t || "")}</textarea>
    <span class="lbl">大きさ</span><div class="choices">${SIZES.map(([n, v]) => `<button class="choice" data-act="tsize" data-v="${v}" aria-pressed="${v === textSize}">${n}</button>`).join("")}</div>
    <span class="lbl">色</span><div class="choices">${PENS.map(c => `<button class="dot" style="--c:${c}" data-act="tcolor" data-c="${c}" aria-pressed="${c === textColor}" aria-label="文字の色"></button>`).join("")}</div>
    <div class="row">${t ? `<button class="btn danger" data-act="tdel">削除</button>` : ""}<span class="spacer"></span><button class="btn" data-act="close">キャンセル</button><button class="btn primary" data-act="tsave">${t ? "保存" : "ページに貼る"}</button></div>`);
  setTimeout(() => document.getElementById("f-text")?.focus(), 30);
}
function openPhoto(pid){
  const p = photos.find(q => q.id === pid); if (!p) return; cur = pid;
  openSheet(`<h2>写真</h2>
    <label for="f-w">大きさ</label><input type="range" id="f-w" min="20" max="85" value="${Math.round((p.w || .46) * 100)}">
    <label for="f-r">傾き</label><input type="range" id="f-r" min="-20" max="20" value="${p.rot || 0}">
    <div class="row"><button class="btn danger" data-act="pdel">削除</button><span class="spacer"></span><button class="btn" data-act="close">キャンセル</button><button class="btn primary" data-act="psave">OK</button></div>`);
  const el = area.querySelector(`.el.photo[data-id="${CSS.escape(pid)}"]`);
  const upd = () => { if (!el) return; el.style.width = val("f-w") + "%"; el.style.setProperty("--r", val("f-r") + "deg"); };
  document.getElementById("f-w").addEventListener("input", upd);
  document.getElementById("f-r").addEventListener("input", upd);
}
function openRename(){
  openSheet(`<h2>タイトルを変更</h2><label for="f-name">スタンプ帳の名前</label><input type="text" id="f-name" maxlength="30" value="${esc(title)}">
    <div class="row"><span class="spacer"></span><button class="btn" data-act="close">キャンセル</button><button class="btn primary" data-act="saveTitle">保存</button></div>`);
}
const arm = (b, label) => { if (b.hasAttribute("data-armed")) return true; b.setAttribute("data-armed", ""); b.textContent = label; return false; };

// ---------- ボタンの操作 ----------
document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, i = cur ? find(cur) : null;
  switch (a) {
    case "login": C.login(); break;
    case "logout": C.logout(); break;
    case "close": dlg.close(); break;
    case "rename": openRename(); break;
    case "add": openItem(null); break;
    case "item": openItem(b.dataset.id); break;
    case "go": if (b.dataset.id) location.hash = "#p-" + encodeURIComponent(b.dataset.id); break;
    case "seed": b.disabled = true; try { for (const t of SAMPLES) await fs.addDoc(C.itemsRef, newItem(t)); } catch (e) { fail(e); b.disabled = false; } break;
    case "saveTitle": { const n = val("f-name"); if (!n) { toast("名前を入力してください。"); return; } dlg.close(); fs.setDoc(C.listRef, { title: n }, { merge: true }).catch(fail); break; }
    case "saveItem": case "did": case "gopage": {
      const t = val("f-title"); if (!t) { toast("やりたいことを入力してください。"); return; }
      const data = { title: t, planDate: val("f-plan"), note: val("f-note") };
      const id = cur;
      dlg.close();
      try {
        if (id) { const it = find(id); if (it.title !== data.title || (it.planDate || "") !== data.planDate || (it.note || "") !== data.note) await fs.updateDoc(C.itemDoc(id), data); }
        else await fs.addDoc(C.itemsRef, newItem(data.title, data.planDate, data.note));
      } catch (e) { fail(e); return; }
      if (a !== "saveItem" && id) location.hash = "#p-" + encodeURIComponent(id);
      break;
    }
    case "del": {
      if (!arm(b, "本当に削除する")) return;
      const id = cur; dlg.close();
      try {
        const ps = await fs.getDocs(C.photosRef(id));
        await Promise.all(ps.docs.map(d => fs.deleteDoc(d.ref)));
        await fs.deleteDoc(C.pageDoc(id)).catch(() => {});
        await fs.deleteDoc(C.itemDoc(id));
      } catch (e) { fail(e); }
      break;
    }
    case "press": {
      const it = find(pageId); if (!it || !tapPos) return;
      const data = { done: true, date: val("f-date") || today(), time: val("f-time"), stampedBy: user.displayName || "", x: tapPos.x, y: tapPos.y, rot: Math.round(Math.random() * 24 - 12) };
      dlg.close(); justStamped = it.id;
      try { await fs.updateDoc(C.itemDoc(it.id), data); } catch (e) { justStamped = null; fail(e); }
      break;
    }
    case "saveStamp": if (i) { const d = { date: val("f-date") || i.date, time: val("f-time") }; dlg.close(); fs.updateDoc(C.itemDoc(i.id), d).catch(fail); } break;
    case "peel": if (i) { if (!arm(b, "本当にはがす")) return; dlg.close(); fs.updateDoc(C.itemDoc(i.id), { done: false, date: "", time: "", stampedBy: "", x: fs.deleteField(), y: fs.deleteField(), rot: fs.deleteField() }).catch(fail); } break;
    case "text": openText(null); break;
    case "tsize": textSize = +b.dataset.v; dlg.querySelectorAll('[data-act="tsize"]').forEach(x => x.setAttribute("aria-pressed", String(x === b))); break;
    case "tcolor": textColor = b.dataset.c; dlg.querySelectorAll('[data-act="tcolor"]').forEach(x => x.setAttribute("aria-pressed", String(x === b))); break;
    case "tsave": {
      const t = val("f-text"); if (!t) { toast("文字を入力してください。"); return; }
      const ex = cur && pageData.texts.find(x => x.id === cur);
      if (ex) Object.assign(ex, { t, s: textSize, c: textColor });
      else pageData.texts.push({ id: uid(), t, s: textSize, c: textColor, x: rnd(.5), y: rnd(.45 + Math.random() * .2), rot: Math.round(Math.random() * 8 - 4) });
      dlg.close(); savePage({ texts: pageData.texts }); updatePage(); break;
    }
    case "tdel": if (!arm(b, "本当に削除する")) return; pageData.texts = pageData.texts.filter(x => x.id !== cur); dlg.close(); savePage({ texts: pageData.texts }); updatePage(); break;
    case "photo": if (photos.length >= MAX_PHOTOS) { toast(`写真は1ページに${MAX_PHOTOS}枚までです。`); return; } document.getElementById("photoin").click(); break;
    case "psave": { const w = rnd(+val("f-w") / 100), rot = +val("f-r"); const id = cur; dlg.close(); fs.updateDoc(C.photoDoc(pageId, id), { w, rot }).catch(fail); break; }
    case "pdel": { if (!arm(b, "本当に削除する")) return; const id = cur; dlg.close(); fs.deleteDoc(C.photoDoc(pageId, id)).catch(fail); break; }
    case "pen": penMode = !penMode; updatePage(); break;
    case "penc": pen.c = b.dataset.c; updatePage(); break;
    case "penw": pen.w = +b.dataset.w; updatePage(); break;
    case "undo": if (pageData.strokes.length) { pageData.strokes.pop(); savePageSoon({ strokes: pageData.strokes }); updatePage(); } break;
  }
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });
dlg.addEventListener("close", () => { if (view === "page") updatePage(); });
dlg.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing || e.target.tagName !== "INPUT" || e.target.type !== "text") return;
  e.preventDefault(); dlg.querySelector(".btn.primary")?.click();
});

// ---------- ログイン状態とデータの読み込み ----------
C.onUser(u => {
  unsubs.forEach(f => f()); unsubs = []; pageUnsubs.forEach(f => f()); pageUnsubs = [];
  user = u; loaded = false; items = []; title = C.DEFAULT_TITLE; shellKey = "";
  if (dlg.open) dlg.close();
  if (!u) { render(); return; }
  const h = location.hash; view = h.startsWith("#p-") ? "page" : h === "#book" ? "book" : "list";
  pageId = view === "page" ? decodeURIComponent(h.slice(3)) : null;
  if (pageId) subscribePage(pageId);
  render();
  const onErr = e => {
    console.error(e);
    if (e.code === "permission-denied") root.innerHTML = `<div class="center"><h1>メンバーに登録されていません</h1><p>${esc(u.email)} はまだメンバーに入っていません。<br>管理者にこのメールアドレスを伝えて、追加してもらってください。</p><button class="btn" data-act="logout">ログアウト</button></div>`;
    else toast("読み込めませんでした。ページを再読み込みしてください。");
  };
  unsubs.push(fs.onSnapshot(C.listRef, s => { title = (s.exists() && s.data().title) || C.DEFAULT_TITLE; if (loaded) render(); }, onErr));
  unsubs.push(fs.onSnapshot(fs.query(C.itemsRef, fs.orderBy("createdAt")), s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true; render();
  }, onErr));
});
</script>
</body>
