<!doctype html>
<html lang="ja">
<head>
<!-- ファイルを更新したら、下の ?v= の数字（ここと common.js の読み込み部分）を1つ増やすと、スマホでも新しいデザインがすぐ反映されます -->
<meta charset="utf-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>管理者ページ｜やりたいことスタンプ帳</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔑</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Shippori+Mincho+B1:wght@800&family=Yomogi&family=Yusei+Magic&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=13">
</head>
<body>
<div id="root"><p class="center">読み込み中…</p></div>
<footer class="credit">
  <p class="by">made by gontiger</p>
  <p class="tech">Built with Firebase &amp; GitHub Pages</p>
</footer>
<dialog id="dlg"></dialog>

<script type="module">
const root = document.getElementById("root"), dlg = document.getElementById("dlg");
let C;
try { C = await import("./common.js?v=13"); }
catch (e) {
  console.error(e);
  root.innerHTML = `<div class="center"><h1>設定を確認してください</h1><p>config.js・common.js・style.css が admin.html と同じ場所にあるか確認してください。</p></div>`;
  throw e;
}
const { fs, esc, fmt, today, toast, fail, stampSVG, MOTIFS, INKS, FRAMES, motifKey } = C;

let user = null, title = C.DEFAULT_TITLE, items = [], loaded = false, unsubs = [], cur = null;
let sel = { motif: null, frame: null, ink: null, img: null, mode: "ink", dateOn: true };
let customs = {};
const find = id => items.find(i => i.id === id);

function render(){
  if (!user) { root.innerHTML = `<div class="center"><h1>管理者ページ</h1><p>管理者のGoogleアカウントでログインしてください。</p><button class="btn primary" data-act="login">Googleでログイン</button></div>`; return; }
  if (!C.isAdmin(user)) { root.innerHTML = `<div class="center"><h1>管理者ではありません</h1><p>${esc(user.email)} は管理者に登録されていません。<br>config.js の admins にメールアドレスを入れてください。</p><a class="btn" href="index.html">スタンプ帳へ戻る</a></div>`; return; }
  if (!loaded) { root.innerHTML = `<p class="center">読み込み中…</p>`; return; }
  const rows = items.map(i => {
    const m = motifKey(i), set = !!(i.motif && MOTIFS[i.motif]);
    return `<div class="adminrow"><span class="mini">${stampSVG(i, i.done ? i.date : "", customs[i.id])}</span>
      <span class="rowtext"><span class="rowtitle">${esc(i.title)}</span>
      <span class="rowmeta">柄：${customs[i.id] ? "画像" : esc(MOTIFS[m][0]) + (set ? "" : "（自動）")}・${i.done ? `${esc(fmt(i.date))} 達成` : "まだ"}</span></span>
      <button class="smallbtn" data-act="edit" data-id="${esc(i.id)}">変える</button></div>`;
  }).join("");
  root.innerHTML = `<div class="userbar"><a class="ghost" href="index.html">← スタンプ帳へ戻る</a><span class="spacer"></span><span>${esc(user.displayName || user.email)}</span><button class="ghost" data-act="logout">ログアウト</button></div>
    <div class="booktitle"><h1>管理者ページ</h1></div>
    <section class="paper ring listpaper">
      <div class="sechead"><h2>スタンプ帳の名前</h2><button class="smallbtn" data-act="rename">変える</button></div>
      <p style="margin:0 4px 14px;font-weight:700">${esc(title)}</p>
      <div class="sechead"><h2>スタンプの柄（${items.length}）</h2></div>
      ${rows || `<p class="note">まだやりたいことがありません。</p>`}
      <p class="note">メンバーには、スタンプを押すまで柄は見えません。柄を指定していない項目は、名前から自動で選ばれます。</p>
      <p class="note">メンバーの追加・削除は、Firebaseのセキュリティルールでメールアドレスを書き換えて行います。</p>
    </section>
    ${maintenance()}`;
}

function maintenance(){
  const pid = encodeURIComponent(C.PROJECT_ID), fb = `https://console.firebase.google.com/project/${pid}`;
  const link = (url, label, note) => `<li><a href="${url}" target="_blank" rel="noopener">${label}</a><span class="rowmeta">${note}</span></li>`;
  let gh = "";
  if (location.hostname.endsWith(".github.io")) {
    const user = location.hostname.split(".")[0], repo = location.pathname.split("/").filter(Boolean)[0];
    if (repo && !repo.endsWith(".html")) gh = link(`https://github.com/${encodeURIComponent(user)}/${encodeURIComponent(repo)}`, "GitHubのリポジトリ", "ファイルの差し替え（Add file → Upload files）");
  }
  return `<section class="paper ring listpaper" style="margin-top:16px">
    <div class="sechead"><h2>メンテナンス用リンク</h2></div>
    <ul class="links">
      ${link(fb + "/overview", "Firebaseのプロジェクト", "全体の様子・使用量の確認")}
      ${link(fb + "/firestore", "データベース（Firestore）", "データの確認、「ルール」タブでメンバーの追加・削除")}
      ${link(fb + "/authentication", "ログイン設定（Authentication）", "ログインした人の一覧、「設定」タブで承認済みドメイン")}
      ${gh}
    </ul></section>`;
}
function previewItem(i){ return { ...i, motif: sel.motif ?? undefined, frame: sel.frame ?? undefined, ink: sel.ink ?? undefined }; }
function openEdit(id){
  const i = find(id); if (!i) return; cur = id;
  const cs = customs[id];
  sel = { motif: i.motif && MOTIFS[i.motif] ? i.motif : null, frame: Number.isInteger(i.frame) ? i.frame : null, ink: Number.isInteger(i.ink) ? i.ink : null,
          img: cs?.data || null, mode: cs?.mode === "original" ? "original" : "ink", dateOn: cs?.date !== false };
  renderSheet();
  if (!dlg.open) dlg.showModal();
}
function renderSheet(){
  const i = find(cur); if (!i) return;
  const scroll = dlg.querySelector(".sheet")?.scrollTop || 0;
  const icon = k => `<svg viewBox="-2 -2 44 44" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${MOTIFS[k][1]}</svg>`;
  const pr = (g, v, cond, label) => `<button class="choice" data-act="${g}" data-v="${v}" aria-pressed="${cond}">${label}</button>`;
  dlg.innerHTML = `<div class="sheet"><h2>${esc(i.title)}</h2>
    <div class="preview" id="pv"></div>
    <span class="lbl">自分で用意した画像（PNG・JPG）</span>
    <div class="choices"><button class="choice" data-act="pickimg">${sel.img ? "別の画像にする" : "画像を選ぶ"}</button>${sel.img ? `<button class="choice" data-act="noimg">画像をやめる</button>` : ""}</div>
    ${sel.img ? `<span class="lbl">画像の使い方</span><div class="choices">${pr("im", "ink", sel.mode === "ink", "インク風（1色＋かすれ）")}${pr("im", "original", sel.mode === "original", "そのままの色")}</div>
      <span class="lbl">日付</span><div class="choices">${pr("idate", "1", sel.dateOn, "下に入れる")}${pr("idate", "0", !sel.dateOn, "入れない")}</div>
      <p class="imgnote">インク風は、白か透明の背景に描いた絵がきれいに出ます。画像を設定している間は、下の柄より画像が優先されます。</p>` : ""}
    <span class="lbl">柄</span><div class="motifgrid">
      <button class="motif" data-act="m" data-v="" aria-pressed="${sel.motif === null}"><svg viewBox="0 0 40 40" aria-hidden="true"><text x="20" y="25" text-anchor="middle" font-size="12" fill="currentColor">自動</text></svg>自動</button>
      ${Object.keys(MOTIFS).map(k => `<button class="motif" data-act="m" data-v="${k}" aria-pressed="${sel.motif === k}">${icon(k)}${esc(MOTIFS[k][0])}</button>`).join("")}</div>
    <span class="lbl">枠の形</span><div class="choices">${pr("f", "", sel.frame === null, "自動")}${FRAMES.map((n, k) => pr("f", k, sel.frame === k, n)).join("")}</div>
    <span class="lbl">インクの色</span><div class="choices">${pr("k", "", sel.ink === null, "自動")}${INKS.map((c, k) => `<button class="dot" style="--c:${c}" data-act="k" data-v="${k}" aria-pressed="${sel.ink === k}" aria-label="色${k + 1}"></button>`).join("")}</div>
    <input type="file" id="imgin" accept="image/png,image/jpeg" hidden>
    <div class="row"><span class="spacer"></span><button class="btn" data-act="close">キャンセル</button><button class="btn primary" data-act="save">保存</button></div></div>`;
  dlg.querySelector(".sheet").scrollTop = scroll;
  document.getElementById("imgin").addEventListener("change", onImage);
  updatePreview();
}
function updatePreview(){
  const i = find(cur); if (!i) return;
  const custom = sel.img ? { data: sel.img, mode: sel.mode, date: sel.dateOn } : null;
  document.getElementById("pv").innerHTML = stampSVG(previewItem(i), i.date || today(), custom);
  const ink = INKS[sel.ink ?? (C.hash(i.id) % INKS.length)];
  dlg.querySelectorAll(".motif").forEach(b => b.style.color = ink);
}
async function shrinkStamp(file){
  const img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = rej; im.src = u; });
  const png = file.type === "image/png";
  let max = 400, out = "";
  for (let k = 0; k < 6; k++) {
    const sc = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * sc); cv.height = Math.round(img.naturalHeight * sc);
    const g = cv.getContext("2d");
    if (!png) { g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height); }
    g.drawImage(img, 0, 0, cv.width, cv.height);
    out = cv.toDataURL(png ? "image/png" : "image/jpeg", .85);
    if (out.length < 600000) return out;
    max *= .8;
  }
  return out;
}
async function onImage(e){
  const file = e.target.files[0]; e.target.value = ""; if (!file) return;
  if (!/^image\/(png|jpeg)$/.test(file.type)) { toast("PNGかJPGの画像を選んでください。"); return; }
  try {
    const data = await shrinkStamp(file);
    if (data.length > 900000) { toast("画像が大きすぎます。もう少し小さい画像で試してください。"); return; }
    sel.img = data; renderSheet();
  } catch (err) { console.error(err); toast("画像を読み込めませんでした。"); }
}
function press(group, b){ dlg.querySelectorAll(`[data-act="${group}"]`).forEach(x => x.setAttribute("aria-pressed", String(x === b))); }

document.addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "login") C.login();
  else if (a === "logout") C.logout();
  else if (a === "close") dlg.close();
  else if (a === "edit") openEdit(b.dataset.id);
  else if (a === "m") { sel.motif = b.dataset.v || null; press("m", b); updatePreview(); }
  else if (a === "f") { sel.frame = b.dataset.v === "" ? null : +b.dataset.v; press("f", b); updatePreview(); }
  else if (a === "k") { sel.ink = b.dataset.v === "" ? null : +b.dataset.v; press("k", b); updatePreview(); }
  else if (a === "pickimg") document.getElementById("imgin").click();
  else if (a === "noimg") { sel.img = null; renderSheet(); }
  else if (a === "im") { sel.mode = b.dataset.v; press("im", b); updatePreview(); }
  else if (a === "idate") { sel.dateOn = b.dataset.v === "1"; press("idate", b); updatePreview(); }
  else if (a === "save") {
    const id = cur; dlg.close();
    try {
      if (sel.img) await fs.setDoc(C.stampDoc(id), { data: sel.img, mode: sel.mode, date: sel.dateOn });
      else if (customs[id]) await fs.deleteDoc(C.stampDoc(id));
      await fs.updateDoc(C.itemDoc(id), {
        motif: sel.motif ?? fs.deleteField(), frame: sel.frame ?? fs.deleteField(), ink: sel.ink ?? fs.deleteField(),
        custom: sel.img ? true : fs.deleteField()
      });
      toast("スタンプを保存しました。");
    } catch (e) { fail(e); }
  }
  else if (a === "rename") {
    dlg.innerHTML = `<div class="sheet"><h2>スタンプ帳の名前</h2><label for="f-name">名前</label><input type="text" id="f-name" maxlength="30" value="${esc(title)}">
      <div class="row"><span class="spacer"></span><button class="btn" data-act="close">キャンセル</button><button class="btn primary" data-act="saveTitle">保存</button></div></div>`;
    dlg.showModal();
  }
  else if (a === "saveTitle") {
    const n = (document.getElementById("f-name")?.value || "").trim(); if (!n) { toast("名前を入力してください。"); return; }
    dlg.close(); fs.setDoc(C.listRef, { title: n }, { merge: true }).catch(fail);
  }
});
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

C.onUser(u => {
  unsubs.forEach(f => f()); unsubs = []; user = u; loaded = false; items = []; customs = {};
  if (dlg.open) dlg.close();
  render();
  if (!u || !C.isAdmin(u)) return;
  const onErr = e => { console.error(e); toast(e.code === "permission-denied" ? "読み込む権限がありません。セキュリティルールを確認してください。" : "読み込めませんでした。"); };
  unsubs.push(fs.onSnapshot(C.listRef, s => { title = (s.exists() && s.data().title) || C.DEFAULT_TITLE; if (loaded) render(); }, onErr));
  unsubs.push(fs.onSnapshot(C.stampsRef, s => { customs = {}; s.docs.forEach(d => customs[d.id] = d.data()); if (loaded) render(); }, onErr));
  unsubs.push(fs.onSnapshot(fs.query(C.itemsRef, fs.orderBy("createdAt")), s => {
    items = s.docs.map(d => ({ id: d.id, ...d.data() })); loaded = true; render();
  }, onErr));
});
</script>
</body>
</html>
